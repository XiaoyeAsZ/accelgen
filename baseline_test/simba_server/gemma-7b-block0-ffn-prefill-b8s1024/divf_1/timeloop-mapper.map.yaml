mapping:
  - target: PPU_OutputReg
    type: datatype
    keep:
      - Outputs
    bypass:
      - Weights
      - Inputs
  - target: PPU_CoeffReg
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: PPU_InputReg
    type: datatype
    keep:
      - Inputs
    bypass:
      - Weights
      - Outputs
  - target: inter_PPU_spatial
    type: datatype
    keep:
      []
    bypass:
      - Weights
      - Inputs
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Inputs
      - Outputs
    bypass:
      - Weights
  - target: DRAM
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: PPU_OutputReg
    type: temporal
    factors: C1 M1 R1 S1 N1 P2 Q2 G1
    permutation: PQCMRSNG
  - target: PPU_CoeffReg
    type: temporal
    factors: C1 M1 R1 S1 N1 P1 Q2 G1
    permutation: QCMRSNPG
  - target: PPU_InputReg
    type: temporal
    factors: C1 M1 R1 S1 N1 P1 Q16 G1
    permutation: QCMRSNPG
  - target: inter_PPU_spatial
    type: spatial
    factors: C1 M1 R1 S1 N1 P256 Q1 G1
    permutation: PCMRSNQG
    split: 1
  - target: inter_PPU_spatial
    type: temporal
    factors: C1 M1 R1 S1 N1 P1 Q1 G1
    permutation: CMRSNPQG
  - target: GlobalBuffer
    type: temporal
    factors: C1 M1 R1 S1 N1 P1 Q2 G1
    permutation: QCMRSNPG
  - target: DRAM
    type: temporal
    factors: C1 M1 R1 S1 N8 P2 Q192 G1
    permutation: PNQCMRSG