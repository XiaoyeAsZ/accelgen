  - target: PPU_InputReg
    type: temporal
    factors: C1 M1 R1 S1 N1 P2 Q1 G1
    permutation: PCMRSNQG
  - target: inter_PPU_spatial
    type: spatial
    factors: C1 M1 R1 S1 N32 P1 Q2 G1
    permutation: QNCMRSPG
    split: 2
  - target: inter_PPU_spatial
    type: temporal
    factors: C1 M1 R1 S1 N1 P1 Q1 G1
    permutation: CMRSNPQG
  - target: GlobalBuffer
    type: temporal
    factors: C1 M1 R1 S1 N2 P1 Q16 G1
    permutation: QNCMRSPG
  - target: DRAM
    type: temporal
    factors: C1 M1 R1 S1 N4 P1 Q2 G1
    permutation: QNCMRSPG