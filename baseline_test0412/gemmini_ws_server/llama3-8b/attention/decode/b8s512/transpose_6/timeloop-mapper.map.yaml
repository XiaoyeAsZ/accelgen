mapping:
  - target: OutputReg
    type: datatype
    keep:
      - Outputs
    bypass:
      - Weights
      - Inputs
  - target: WeightReg
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: InputReg
    type: datatype
    keep:
      - Inputs
    bypass:
      - Weights
      - Outputs
  - target: inter_PE_spatial
    type: datatype
    keep:
      []
    bypass:
      - Weights
      - Inputs
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Inputs
      - Outputs
    bypass:
      - Weights
  - target: DRAM
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: OutputReg
    type: temporal
    factors: C1 M1 R1 S1 N1 P1 Q2 G1
    permutation: QCMRSNPG
  - target: WeightReg
    type: temporal
    factors: C1 M1 R1 S1 N2 P1 Q2 G1
    permutation: QNCMRSPG
  - target: InputReg
    type: temporal
    factors: C1 M1 R1 S1 N2 P2 Q1 G1
    permutation: NPCMRSQG
  - target: inter_PE_spatial
    type: spatial
    factors: C1 M1 R1 S1 N1 P8 Q64 G1
    permutation: PQCMRSNG
    split: 2
  - target: inter_PE_spatial
    type: temporal
    factors: C1 M1 R1 S1 N1 P1 Q1 G1
    permutation: CMRSNPQG
  - target: GlobalBuffer
    type: temporal
    factors: C1 M1 R1 S1 N1 P2 Q32 G1
    permutation: QPCMRSNG
  - target: DRAM
    type: temporal
    factors: C1 M1 R1 S1 N2 P1 Q8 G1
    permutation: NQCMRSPG