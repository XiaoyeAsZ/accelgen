problem:
  version: 0.3

  shape:
    name: gemm
    dimensions: [M, N, K]

  instance:
    M: 1024
    N: 1024
    K: 1024

  data_spaces:
  - name: Weights
    projection:
    - [K]
    - [N]

  - name: Inputs
    projection:
    - [M]
    - [K]

  - name: Outputs
    projection:
    - [M]
    - [N]
    read_write: True