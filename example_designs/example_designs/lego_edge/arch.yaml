architecture:
  # ============================================================================
  # Lego - Edge Configuration (Flexible Dataflow)
  # ============================================================================
  # SAME hardware as gemmini_edge (DAC 2021) Fig 1:
  #   DRAM → Scratchpad (banked SRAM) → 2D Systolic Array + Accumulator
  #
  # Key difference from gemmini_edge: relaxed mapping constraints.
  # - No spatial permutation constraint  → mapper can map any dim to X/Y
  # - No temporal constraints on accumulator/registers → free dataflow
  # Mapper is free to explore Weight-Stationary, Output-Stationary, etc.
  # ============================================================================
  version: 0.4
  nodes:
  - !Container
    name: system

  - !Component
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      width: 1024             # 128 bytes × 8 = 1024 bits
      datawidth: 16

  - !Container
    name: gemmini
    attributes:
      technology: "45nm"

  # ========================= Scratchpad (banked SRAM) =======================
  # Physical wiring: feeds Inputs+Weights to PE array. Same for any dataflow.
  - !Component
    name: scratchpad
    class: smartbuffer_SRAM
    attributes:
      depth: 65536           # 256 banks × 256 depth
      width: 512
      n_banks: 256
      datawidth: 16
    constraints:
      dataspace: {keep: [Inputs, Weights], bypass: [Outputs]}

  # ========================= 2D Systolic PE Array ===========================
  # Same 64×64 hardware as gemmini_edge.
  # Relaxed: no permutation constraint — mapper decides dimension mapping.
  - !Container
    name: PE
    spatial: {meshX: 64, meshY: 64}
    constraints:
      spatial:
        factors: [R=1, S=1, Q=1, N=1]

  # ========================= Accumulator (per-PE output buffer) =============
  # Physical wiring: holds Outputs/partial sums. Same for any dataflow.
  # Relaxed: no temporal constraints.
  - !Component
    name: accumulator
    class: smartbuffer_SRAM
    attributes:
      depth: 192
      width: 32
      datawidth: 32
    constraints:
      dataspace: {keep: [Outputs], bypass: [Inputs, Weights]}

  # ========================= PE Registers ===================================
  # Relaxed: no temporal constraints — mapper freely chooses dataflow.
  - !Parallel
    nodes:
    - !Component
      name: weight_reg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 16
        datawidth: 16
      constraints:
        dataspace: {keep: [Weights]}

    - !Component
      name: input_reg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 16
        datawidth: 16
      constraints:
        dataspace: {keep: [Inputs]}

    - !Component
      name: output_reg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 32
        datawidth: 32
      constraints:
        dataspace: {keep: [Outputs]}

  # ========================= MAC Unit =======================================
  - !Component
    name: mac
    class: intmac
    attributes:
      multiplier_width: 16
      adder_width: 32
