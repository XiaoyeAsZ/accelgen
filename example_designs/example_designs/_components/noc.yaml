compound_components:
  version: 0.4
  classes:
  - name: noc
    attributes:
      technology: "must_specify"
      width: "must_specify"
      depth: "must_specify"
      global_cycle_seconds: "must_specify"
      n_routers: 16
      n_router_ports: 5
      vc_count: 4
      # Paper-aligned single-chip approximation: 4x4 mesh routers.
      # Directed local links for 4x4 mesh: 2 * (4*(4-1) + 4*(4-1)) = 48.
      n_local_links: 48
      # No separate long-haul link class in this single-chip approximation.
      n_global_links: 0
      # Average Manhattan hops in a 4x4 mesh is ~2.5.
      avg_hops_local: 2.5
      avg_hops_global: 0
      # Path-based accounting terms (dynamic energy).
      # One transfer touches (hops + 1) routers and hops links.
      router_traversals_per_access: avg_hops_local + avg_hops_global + 1
      local_link_traversals_per_access: avg_hops_local
      global_link_traversals_per_access: avg_hops_global
      local_link_length: 1000
      global_link_length: 2000
      # Per-router ingress buffering derived from logical NoC capacity.
      input_buffer_depth: max(1, ceil(depth / n_routers))
      output_buffer_depth: 2

    subcomponents:
    # Simba-style router array (abstracted with scale factors).
    - name: routers[0..1]
      class: noc_router
      attributes:
        technology: technology
        global_cycle_seconds: global_cycle_seconds
        width: width
        n_router_ports: n_router_ports
        vc_count: vc_count
        input_buffer_depth: input_buffer_depth
        output_buffer_depth: output_buffer_depth

    # Local links (short wires, e.g., intra-cluster).
    - name: local_links[0..1]
      class: wire
      attributes:
        technology: technology
        global_cycle_seconds: global_cycle_seconds
        width: width
        length: local_link_length

    # Global links (long wires, e.g., inter-cluster / long-haul).
    - name: global_links[0..1]
      class: wire
      attributes:
        technology: technology
        global_cycle_seconds: global_cycle_seconds
        width: width
        length: global_link_length

    actions:
    - &write_action
      name: write
      subcomponents:
      - name: routers[0..1]
        actions: [{name: write, energy_scale: 1 / 2}]
      - name: routers[0..1]
        actions: [{name: transfer, energy_scale: router_traversals_per_access / 2}]
      - name: local_links[0..1]
        actions: [{name: transfer, energy_scale: local_link_traversals_per_access / 2}]
      - name: global_links[0..1]
        actions: [{name: transfer, energy_scale: global_link_traversals_per_access / 2}]

    - name: read
      subcomponents:
      - name: routers[0..1]
        actions: [{name: read, energy_scale: 1 / 2}]
      - name: routers[0..1]
        actions: [{name: transfer, energy_scale: router_traversals_per_access / 2}]
      - name: local_links[0..1]
        actions: [{name: transfer, energy_scale: local_link_traversals_per_access / 2}]
      - name: global_links[0..1]
        actions: [{name: transfer, energy_scale: global_link_traversals_per_access / 2}]

    - name: update
      << : *write_action

    - name: leak
      subcomponents:
      - name: routers[0..1]
        actions: [{name: leak, energy_scale: n_routers / 2}]
