architecture:
  version: 0.4
  nodes: # Top-level is hierarchical
  - !Container # Top-level system
    name: System
    attributes:
      datawidth: 8
      technology: "45nm"
  
  - !Component # DRAM main memory
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      width: 1024          # server dram bandwidth=1024
      datawidth: 8

  - !Component # Global buffer (server: 1024 banks x 512 width x 256 depth = 16MB)
    name: GlobalBuffer
    class: smartbuffer_SRAM
    attributes:
      depth: 262144         # sram_bank(1024) × sram_depth(256) = 262144
      width: 512            # sram_width=512
      datawidth: 8
      n_banks: 1024         # sram_bank=1024
      nports: 2
    constraints:
      dataspace: {keep: [Inputs, Weights, Outputs]}

  - !Container # Single PE (no multi-PE; the MAC array is inside)
    name: PE
    spatial: {meshX: 1}
    constraints:
      spatial:
        factors: [R=1, S=1, P=1, Q=1, N=1, M=1, C=1, G=1]

  - !Component # Input buffer
    name: PEInputBuffer
    class: storage
    subclass: smartbuffer_RF
    attributes:
      depth: 8192
      width: 64
      datawidth: 8
    constraints:
      dataspace: {keep: [Inputs], bypass: [Weights, Outputs]}

  - !Container # 512 weight-buffer columns (M dimension primary)
    name: distributed_buffers
    spatial: {meshY: 512}
    constraints:
      spatial:
        factors: [R=1, S=1, C=1, G=1]  # C=1: keep reduction out; M/P/Q/N free to fill 512
        permutation: [M, P, Q, N, C, R, S]
        split: 0

  - !Parallel # Weight/accumulator buffers
    nodes:
    - !Component # Weight buffer (per column)
      name: PEWeightBuffer
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 4096
        width: 64
        datawidth: 8
        n_banks: 8
      constraints:
        dataspace: {keep: [Weights], bypass: [Inputs, Outputs]}

    - !Component # Accumulator buffer (per column)
      name: PEAccuBuffer
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 1024
        datawidth: 24
        width: 24
      constraints:
        dataspace: {keep: [Outputs], bypass: [Inputs, Weights]}

    - !Nothing {constraints: {dataspace: {keep: [Inputs]}}}

  - !Container # 512 registers/MAC pairs per column (C dimension primary)
    name: reg_mac
    spatial: {meshY: 512}
    constraints:
      spatial:
        factors: [R=1, S=1, M=1, G=1]  # M=1: keep output dim out; C/P/Q/N free to fill 512
        permutation: [C, P, Q, N, M, R, S]
        split: 0

  - !Component # Weight registers
    name: PEWeightRegs
    class: storage
    subclass: smartbuffer_RF
    attributes:
      depth: 1
      width: 512
      cluster_size: 64
      num_ports: 2
      datawidth: 8
    constraints:
      dataspace: {keep: [Weights], bypass: [Inputs, Outputs]}

  - !Component # MAC unit
    name: mac
    class: intmac
    attributes:
      multiplier_width: 8
      adder_width: 16
