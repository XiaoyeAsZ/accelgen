architecture:
  # ============================================================================
  # Post-Processing Unit (PPU) Architecture for Nonlinear Operators
  # ============================================================================
  # A dedicated post-processing unit (PPU) architecture for computing
  # elementwise nonlinear functions in GPT-2 (GELU, Softmax, LayerNorm).
  #
  # Design philosophy:
  #   - Separate from the GEMM datapath (Simba-like MAC array)
  #   - Shares DRAM; has its own on-chip buffer hierarchy
  #   - 16 parallel vector lanes for throughput
  #   - Optimized for pointwise (C=1, M=1) elementwise workloads
  # ============================================================================
  version: 0.4
  nodes:
  - !Container
    name: System
    attributes:
      datawidth: 8
      technology: "45nm"

  # ========================= Off-chip Memory ================================
  # DRAM is kept for Timeloop tiling (full tensor > GlobalBuffer capacity).
  # In real Simba, DRAM I/O is ALREADY counted in the linear layer's run.
  # When summing total GPT-2 energy, only take on-chip energy from here:
  #   E_total = E_simba_linear(includes DRAM) + E_ppu(GB + Regs + compute only)
  - !Component
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      width: 64
      datawidth: 8

  # ========================= On-chip Global Buffer ==========================
  # Aligned with Simba's GlobalBuffer. PPU reads data that the MAC array
  # just wrote here — no extra DRAM round-trip in the real pipeline.
  - !Component
    name: GlobalBuffer
    class: smartbuffer_SRAM
    attributes:
      depth: 2048        # same as Simba
      width: 256         # same as Simba
      datawidth: 8
      n_banks: 4
      nports: 2
    constraints:
      dataspace: {keep: [Inputs, Outputs], bypass: [Weights]}

  # ========================= Post-Processing Unit ===========================
  - !Container
    name: PPU
    spatial: {meshX: 1}
    constraints:
      spatial:
        # Each lane processes a different spatial position.
        # P, Q, N are all parallel for elementwise ops.
        factors: [C=1, M=1, R=1, S=1]
        permutation: [P, Q, N, M, C, R, S]

  # Per-lane activation register (small buffer for input elements)
  - !Parallel
    nodes:
    - !Component
      name: PPU_InputReg
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 16
        width: 64
        datawidth: 8
      constraints:
        dataspace: {keep: [Inputs], bypass: [Weights, Outputs]}

    - !Component
      name: PPU_CoeffReg
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 16
        width: 64
        datawidth: 8
      constraints:
        dataspace: {keep: [Weights], bypass: [Inputs, Outputs]}

    - !Component
      name: PPU_OutputReg
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 16
        width: 64
        datawidth: 16
      constraints:
        dataspace: {keep: [Outputs], bypass: [Inputs, Weights]}

  # PPU compute unit (one per lane)
  # class must be one of: mac/intmac/fpmac/compute (Timeloop parser constraint).
  # subclass: vector_unit tells Accelergy to use our custom compound component
  # for energy/area estimation.
  - !Component
    name: ppu_compute
    class: intmac
    subclass: vector_unit
    attributes:
      datawidth: 8
      # n_poly_terms must match the workload's C (number of poly terms).
      # Used to amortize comparator: fires once per element, not once per MAC.
      # GELU=4, Softmax=5, LayerNorm=2. Set to 4 as default (GELU).
      n_poly_terms: 4

