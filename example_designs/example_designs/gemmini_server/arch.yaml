architecture:
  # ============================================================================
  # Gemmini Output-Stationary (OS) - Server Configuration
  # ============================================================================
  # Scaled-up version of edge Gemmini (same flat structure, larger resources):
  #   DRAM → Scratchpad (banked SRAM) → Spatial Array + Accumulator
  # No NoC — single accelerator with DMA engine direct to DRAM/L2.
  #
  # Concrete sizes scaled to match config/server.json:
  #   - DRAM bandwidth: 1024
  #   - Scratchpad: sram_bank(1024) × sram_width(512) × sram_depth(256)
  #   - MAC array: 512×512 = 262144 MACs (mulf_bf16=262656 = 262144+512 PPU)
  #   - bf16 datawidth=16
  #   - OS dataflow: partial sums stay in Accumulator/PE
  # ============================================================================
  version: 0.4
  nodes:
  - !Container
    name: System
    attributes:
      datawidth: 16
      technology: "45nm"

  # ========================= Off-chip Memory ================================
  # DMA engine reads/writes DRAM directly (no NoC)
  - !Component
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      width: 1024            # server dram bandwidth=1024
      datawidth: 16

  # ========================= Scratchpad (banked SRAM) =======================
  # Paper: "The spatial array reads data from a local, explicitly managed
  #         scratchpad of banked SRAMs"
  # In OS mode: Scratchpad holds Inputs + Weights; Outputs go to Accumulator
  - !Component
    name: Scratchpad
    class: smartbuffer_SRAM
    attributes:
      depth: 262144          # sram_bank(1024) × sram_depth(256) = 262144
      width: 512             # sram_width=512
      datawidth: 16
      n_banks: 1024          # sram_bank=1024
      nports: 2
    constraints:
      dataspace: {keep: [Inputs, Weights], bypass: [Outputs]}

  # ========================= PE Columns (512, spatial on M) =================
  - !Container
    name: PECols
    spatial: {meshX: 512}
    constraints:
      spatial:
        factors: [R=1, S=1, P=1, Q=1, N=1, C=1]
        permutation: [M]
        split: 0

  # ========================= Accumulator SRAM (per column) ==================
  # OS: partial sums stay here
  - !Component
    name: Accumulator
    class: smartbuffer_SRAM
    attributes:
      depth: 1024
      width: 32
      datawidth: 32
      n_banks: 2
      nports: 2
    constraints:
      dataspace: {keep: [Outputs], bypass: [Inputs, Weights]}

  # ========================= PE Rows (512, spatial on C/K reduction) ========
  - !Container
    name: PERows
    spatial: {meshY: 512}
    constraints:
      spatial:
        factors: [R=1, S=1, P=1, Q=1, M=1, N=1]
        permutation: [C]
        split: 0

  # ========================= PE Registers (OS) =============================
  - !Parallel
    nodes:
    - !Component
      name: WeightReg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 16
        datawidth: 16
      constraints:
        dataspace: {keep: [Weights]}
        temporal: {factors: [R=1, S=1, M=1, C=1]}

    - !Component
      name: InputReg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 16
        datawidth: 16
      constraints:
        dataspace: {keep: [Inputs]}
        temporal: {factors: [P=1, Q=1, C=1, N=1]}

    # OS: Output partial sum stays in register across C/K iterations
    - !Component
      name: OutputReg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 32
        datawidth: 32
      constraints:
        dataspace: {keep: [Outputs]}
        temporal: {factors: [P=1, Q=1, M=1, N=1]}

  # ========================= MAC Unit =======================================
  - !Component
    name: mac
    class: intmac
    attributes:
      multiplier_width: 16
      adder_width: 32
