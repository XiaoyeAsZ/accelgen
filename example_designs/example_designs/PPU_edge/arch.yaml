architecture:
  # ============================================================================
  # Post-Processing Unit (PPU) - Edge Configuration (64 lanes)
  # ============================================================================
  # Dedicated PPU for elementwise nonlinear functions.
  # 64 parallel vector lanes matching the edge MAC array dimension.
  # ============================================================================
  version: 0.4
  nodes:
  - !Container
    name: System
    attributes:
      datawidth: 16
      technology: "45nm"

  # ========================= Off-chip Memory ================================
  - !Component
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      width: 128             # edge dram bandwidth=128
      datawidth: 16

  # ========================= On-chip Global Buffer ==========================
  # Aligned with simba_edge GlobalBuffer parameters
  - !Component
    name: GlobalBuffer
    class: smartbuffer_SRAM
    attributes:
      depth: 8192            # same as simba_edge
      width: 512             # same as simba_edge
      datawidth: 16
      n_banks: 256           # same as simba_edge
      nports: 2
    constraints:
      dataspace: {keep: [Inputs, Outputs], bypass: [Weights]}

  # ========================= Post-Processing Unit ===========================
  - !Container
    name: PPU
    spatial: {meshX: 64}     # 64 parallel vector lanes
    constraints:
      spatial:
        factors: [C=1, M=1, R=1, S=1]
        permutation: [P, Q, N, M, C, R, S]

  # Per-lane registers
  - !Parallel
    nodes:
    - !Component
      name: PPU_InputReg
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 16
        width: 64
        datawidth: 16
      constraints:
        dataspace: {keep: [Inputs], bypass: [Weights, Outputs]}

    - !Component
      name: PPU_CoeffReg
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 16
        width: 64
        datawidth: 16
      constraints:
        dataspace: {keep: [Weights], bypass: [Inputs, Outputs]}

    - !Component
      name: PPU_OutputReg
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 16
        width: 64
        datawidth: 32
      constraints:
        dataspace: {keep: [Outputs], bypass: [Inputs, Weights]}

  # PPU compute unit (one per lane)
  - !Component
    name: ppu_compute
    class: intmac
    subclass: vector_unit
    attributes:
      datawidth: 16
      n_poly_terms: 4
