architecture:
  # ============================================================================
  # Post-Processing Unit (PPU) - Server Configuration (512 lanes)
  # ============================================================================
  # Dedicated PPU for elementwise nonlinear functions.
  # 512 parallel vector lanes matching the server MAC array dimension.
  # ============================================================================
  version: 0.4
  nodes:
  - !Container
    name: System
    attributes:
      datawidth: 8
      technology: "45nm"

  # ========================= Off-chip Memory ================================
  - !Component
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      width: 1024            # server dram bandwidth=1024
      datawidth: 8

  # ========================= On-chip Global Buffer ==========================
  # Aligned with simba_server GlobalBuffer parameters
  - !Component
    name: GlobalBuffer
    class: smartbuffer_SRAM
    attributes:
      depth: 65536           # same as simba_server
      width: 512             # same as simba_server
      datawidth: 8
      n_banks: 1024          # same as simba_server
      nports: 2
    constraints:
      dataspace: {keep: [Inputs, Outputs], bypass: [Weights]}

  # ========================= Post-Processing Unit ===========================
  - !Container
    name: PPU
    spatial: {meshX: 512}    # 512 parallel vector lanes
    constraints:
      spatial:
        factors: [C=1, M=1, R=1, S=1]
        permutation: [P, Q, N, M, C, R, S]

  # Per-lane registers
  - !Parallel
    nodes:
    - !Component
      name: PPU_InputReg
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 16
        width: 64
        datawidth: 8
      constraints:
        dataspace: {keep: [Inputs], bypass: [Weights, Outputs]}

    - !Component
      name: PPU_CoeffReg
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 16
        width: 64
        datawidth: 8
      constraints:
        dataspace: {keep: [Weights], bypass: [Inputs, Outputs]}

    - !Component
      name: PPU_OutputReg
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 16
        width: 64
        datawidth: 16
      constraints:
        dataspace: {keep: [Outputs], bypass: [Inputs, Weights]}

  # PPU compute unit (one per lane)
  - !Component
    name: ppu_compute
    class: intmac
    subclass: vector_unit
    attributes:
      datawidth: 8
      n_poly_terms: 4
