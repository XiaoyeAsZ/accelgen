architecture:
  version: 0.4
  nodes: # Top-level is hierarchical
  - !Container # Top-level system
    name: System
    attributes:
      datawidth: 16
      technology: "45nm"
  
  - !Component # DRAM main memory
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      width: 128           # edge dram bandwidth=128
      datawidth: 16

  - !Component # DRAM-to-SRAM interconnect (single PE, no multi-chiplet)
    name: NoC
    class: storage
    subclass: noc
    attributes:
      depth: 16384          # scaled for 4096 MACs (8x vs simba_like's 64 MACs)
      width: 128
      datawidth: 16
      n_banks: 1
      n_routers: 1           # single PE, single router
      n_router_ports: 2       # in/out only
      vc_count: 1
      n_local_links: 1
      n_global_links: 0
      avg_hops_local: 1       # direct connection
      avg_hops_global: 0
      local_link_length: 1000
      global_link_length: 0
      read_bandwidth: 128
      write_bandwidth: 128
    constraints:
      dataspace: {keep: [Inputs, Weights, Outputs], no_coalesce: [Inputs, Weights, Outputs]}

  - !Component # Global buffer (edge: 256 banks x 512 width x 256 depth = 4MB)
    name: GlobalBuffer
    class: smartbuffer_SRAM
    attributes:
      depth: 65536          # sram_bank(256) × sram_depth(256) = 65536
      width: 512            # sram_width=512
      datawidth: 16
      n_banks: 256          # sram_bank=256
      nports: 2
    constraints:
      dataspace: {keep: [Inputs, Outputs], bypass: [Weights]}

  - !Container # Single PE (no multi-PE; the MAC array is inside)
    name: PE
    spatial: {meshX: 1}
    constraints:
      spatial:
        factors: [R=1, S=1, Q=1]

  - !Component # Input buffer (8× width & banks vs simba_like for 64× MACs)
    name: PEInputBuffer
    class: storage
    subclass: smartbuffer_RF
    attributes:
      depth: 8192
      width: 1024            # 128→1024 (8× capacity: 8192×64=524288 elements)
      datawidth: 16
      n_banks: 8              # 8× parallel read bandwidth
    constraints:
      dataspace: {keep: [Inputs], bypass: [Weights, Outputs]}

  - !Container # 64 weight-buffer columns (M dimension primary)
    name: distributed_buffers
    spatial: {meshY: 64}
    constraints:
      spatial:
        factors: [Q=1, R=1, S=1, P=1] 
        permutation: [M, C, P]

  - !Parallel # Weight/accumulator buffers
    nodes:
    - !Component # Weight buffer (per column, 8× width & banks for 64 MACs)
      name: PEWeightBuffer
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 4096
        width: 1024           # 128→1024 (8× capacity: 4096×64=262144 elements)
        datawidth: 16
        n_banks: 64            # 8→64 (8× bandwidth, one bank per downstream MAC)
      constraints:
        dataspace: {keep: [Weights], bypass: [Inputs, Outputs]}

    - !Component # Accumulator buffer (per column, 8× width & banks for 64 MACs)
      name: PEAccuBuffer
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 1024
        datawidth: 32
        width: 256             # 32→256 (8× capacity: 1024×8=8192 elements)
        n_banks: 64             # one bank per downstream MAC (reg_mac meshY=64)
      constraints:
        dataspace: {keep: [Outputs], bypass: [Inputs, Weights]}

    - !Nothing {constraints: {dataspace: {keep: [Inputs]}}}

  - !Container # 64 registers/MAC pairs per column (C dimension primary)
    name: reg_mac
    spatial: {meshY: 64}
    constraints:
      spatial:
        factors: [Q=1, R=1, S=1, P=1]  
        permutation: [C, M, P]

  - !Component # Weight registers
    name: PEWeightRegs
    class: storage
    subclass: smartbuffer_RF
    attributes:
      depth: 1
      width: 1024
      cluster_size: 64
      num_ports: 2
      datawidth: 16
    constraints:
      dataspace: {keep: [Weights], bypass: [Inputs, Outputs]}

  - !Component # MAC unit
    name: mac
    class: intmac
    attributes:
      multiplier_width: 16
      adder_width: 32
