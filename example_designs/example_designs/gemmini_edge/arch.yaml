architecture:
  version: 0.4
  nodes:
  - !Container
    name: system

  - !Component
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      width: 128
      datawidth: 16

  - !Container
    name: gemmini
    attributes:
      technology: "45nm"

  # Scratchpad: shared banked SRAM, holds Inputs + Weights only
  - !Component
    name: scratchpad
    class: smartbuffer_SRAM
    attributes:
      depth: 65536           # 256 banks × 256 depth
      width: 512
      n_banks: 256
      datawidth: 16
    constraints:
      dataspace: {keep: [Inputs, Weights], bypass: [Outputs]}

  # Single 2D systolic array: meshX maps M (columns), meshY maps C (rows)
  - !Container
    name: PE
    spatial: {meshX: 64, meshY: 64}
    constraints:
      spatial:
        permutation: [P, M]
        factors: [R=1, S=1, Q=1]

  # Accumulator: per-PE output buffer, wider bitwidth for partial sums
  - !Component
    name: accumulator
    class: smartbuffer_SRAM
    attributes:
      depth: 192
      width: 32
      datawidth: 32
    constraints:
      dataspace: {keep: [Outputs], bypass: [Inputs, Weights]}
      temporal: {permutation: [R, S, Q]}

  - !Parallel
    nodes:
    - !Component
      name: weight_reg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 16
        datawidth: 16
      constraints:
        dataspace: {keep: [Weights]}
        temporal: {factors: [R=1, S=1]}

    - !Component
      name: input_reg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 16
        datawidth: 16
      constraints:
        dataspace: {keep: [Inputs]}
        temporal: {factors: [Q=1, N=1]}

    - !Component
      name: output_reg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 32
        datawidth: 32
      constraints:
        dataspace: {keep: [Outputs]}
        temporal: {factors: [Q=1, N=1]}

  - !Component
    name: mac
    class: intmac
    attributes:
      multiplier_width: 16
      adder_width: 32