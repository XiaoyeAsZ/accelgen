architecture:
  version: 0.4
  nodes: # Top-level is hierarchical
  - !Container # Top-level system
    name: System
    attributes:
      datawidth: 16
      technology: "45nm"
  
  - !Component # DRAM main memory
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      width: 1024          # server dram bandwidth=1024
      datawidth: 16

  - !Component # Inter-PE NoC (8×8 PE mesh, 64 PEs)
    name: NoC
    class: storage
    subclass: noc
    attributes:
      depth: 65536          # scaled for 64 PEs × 4096 MACs = 262144 MACs
      width: 1024
      datawidth: 16
      n_banks: 1
      n_routers: 64          # 8×8 PE mesh
      n_router_ports: 5       # 4 neighbors + 1 local
      vc_count: 4
      n_local_links: 112      # 8×8 mesh: 2 × 8 × 7 = 112 bidirectional links
      n_global_links: 0
      avg_hops_local: 5.33    # 8×8 mesh average Manhattan distance
      avg_hops_global: 0
      local_link_length: 1000
      global_link_length: 0
      read_bandwidth: 1024
      write_bandwidth: 1024
    constraints:
      dataspace: {keep: [Inputs, Weights, Outputs], no_coalesce: [Inputs, Weights, Outputs]}

  - !Component # Global buffer shared across 64 PEs (1024 banks × 512 width × 256 depth = 16MB)
    name: GlobalBuffer
    class: smartbuffer_SRAM
    attributes:
      depth: 262144         # sram_bank(1024) × sram_depth(256) = 262144
      width: 512            # sram_width=512
      datawidth: 16
      n_banks: 1024         # sram_bank=1024
      nports: 2
    constraints:
      dataspace: {keep: [Inputs, Outputs], bypass: [Weights]}

  - !Container # 64 PEs in 8×8 mesh (each PE = edge: 64×64 MAC array)
    name: PE
    spatial: {meshX: 64}
    constraints:
      spatial:
        factors: [P=1, Q=1, R=1, S=1, N=1]  # M and C spatial across PEs (paper: parallel_for k2, c2)
        permutation: [M, C]
        split: 0

  - !Component # Input buffer
    name: PEInputBuffer
    class: storage
    subclass: smartbuffer_RF
    attributes:
      depth: 8192
      width: 128
      datawidth: 16
    constraints:
      dataspace: {keep: [Inputs], bypass: [Weights, Outputs]}

  - !Container # 64 weight-buffer columns per PE (M dimension, same as edge)
    name: distributed_buffers
    spatial: {meshY: 64}
    constraints:
      spatial:
        factors: [P=1, Q=1, R=1, S=1, C=1, N=1]  # Only M is spatial (paper: parallel_for k0)
        permutation: [M, C]
        split: 0

  - !Parallel # Weight/accumulator buffers
    nodes:
    - !Component # Weight buffer (per column)
      name: PEWeightBuffer
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 4096
        width: 128
        datawidth: 16
        n_banks: 8
      constraints:
        dataspace: {keep: [Weights], bypass: [Inputs, Outputs]}

    - !Component # Accumulator buffer (per column)
      name: PEAccuBuffer
      class: storage
      subclass: smartbuffer_RF
      attributes:
        depth: 1024
        datawidth: 32
        width: 32
      constraints:
        dataspace: {keep: [Outputs], bypass: [Inputs, Weights]}

    - !Nothing {constraints: {dataspace: {keep: [Inputs]}}}

  - !Container # 64 registers/MAC pairs per column (C dimension, same as edge)
    name: reg_mac
    spatial: {meshY: 64}
    constraints:
      spatial:
        factors: [P=1, Q=1, R=1, S=1, M=1, N=1]  # Only C is spatial (paper: parallel_for c0)
        permutation: [C, M]
        split: 0

  - !Component # Weight registers
    name: PEWeightRegs
    class: storage
    subclass: smartbuffer_RF
    attributes:
      depth: 1
      width: 1024
      cluster_size: 64
      num_ports: 2
      datawidth: 16
    constraints:
      dataspace: {keep: [Weights], bypass: [Inputs, Outputs]}

  - !Component # MAC unit
    name: mac
    class: intmac
    attributes:
      multiplier_width: 16
      adder_width: 32
