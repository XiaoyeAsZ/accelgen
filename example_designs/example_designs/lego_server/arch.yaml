architecture:
  version: 0.4
  nodes:
  - !Container
    name: system

  - !Component
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      width: 8192             # 1024 bytes × 8 = 8192 bits
      datawidth: 16

  - !Container
    name: lego
    attributes:
      technology: "45nm"

  # Scratchpad: shared banked SRAM, holds Inputs + Weights only
  - !Component
    name: scratchpad
    class: smartbuffer_SRAM
    attributes:
      depth: 262144          # 1024 banks × 256 depth
      width: 512
      n_banks: 1024
      datawidth: 16

  # Single 2D systolic array: meshX maps M (columns), meshY maps C (rows)
  - !Container
    name: PE
    spatial: {meshX: 64, meshY: 64}

  # Accumulator: per-PE output buffer, wider bitwidth for partial sums
  - !Component
    name: accumulator
    class: smartbuffer_SRAM
    attributes:
      depth: 192
      width: 32
      datawidth: 32

  - !Parallel
    nodes:
    - !Component
      name: weight_reg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 16
        datawidth: 16

    - !Component
      name: input_reg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 16
        datawidth: 16

    - !Component
      name: output_reg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 32
        datawidth: 32

  - !Component
    name: mac
    class: intmac
    attributes:
      multiplier_width: 16
      adder_width: 32