architecture:
  # ============================================================================
  # Lego - Server Configuration (Flexible WS/OS Dataflow)
  # ============================================================================
  # Same hardware structure as Gemmini server (multi-tile):
  #   DRAM → GlobalBuffer → Tiles → Scratchpad → Spatial Array + Accumulator
  #
  # Key difference from gemmini_server: NO dataflow constraints.
  # Mapper is free to explore both Output-Stationary and Weight-Stationary.
  #
  # Sizes match config/server.json:
  #   - DRAM bandwidth: 1024
  #   - GlobalBuffer: sram_bank(1024) × sram_width(512) × sram_depth(256)
  #   - 64 tiles × 64×64 MACs = 262144 MACs (mulf_bf16=262656 = 262144+512 PPU)
  #   - bf16 datawidth=16
  # ============================================================================
  version: 0.4
  nodes:
  - !Container
    name: System
    attributes:
      datawidth: 16
      technology: "45nm"

  # ========================= Off-chip Memory ================================
  - !Component
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      width: 1024            # server dram bandwidth=1024
      datawidth: 16

  # ========================= Shared Global Buffer ===========================
  # Hardware data path: GlobalBuffer distributes Inputs+Weights to tiles.
  - !Component
    name: GlobalBuffer
    class: smartbuffer_SRAM
    attributes:
      depth: 262144          # sram_bank(1024) × sram_depth(256) = 262144
      width: 512             # sram_width=512
      datawidth: 16
      n_banks: 1024          # sram_bank=1024
      nports: 2
    constraints:
      dataspace: {keep: [Inputs, Weights], bypass: [Outputs]}

  # ========================= Gemmini Tiles ==================================
  - !Container
    name: GemminiTile
    spatial: {meshX: 64}
    constraints:
      spatial:
        factors: [R=1, S=1, P=1, Q=1, N=1, G=1]
        permutation: [M, C, P, Q, N, R, S]
        split: 0

  # ========================= Per-Tile Scratchpad ============================
  # Hardware data path: feeds Inputs+Weights to PE array (same as edge).
  - !Component
    name: Scratchpad
    class: smartbuffer_SRAM
    attributes:
      depth: 16384
      width: 128
      datawidth: 16
      n_banks: 4
      nports: 2
    constraints:
      dataspace: {keep: [Inputs, Weights], bypass: [Outputs]}

  # ========================= PE Columns (spatial dim 1) =====================
  - !Container
    name: PECols
    spatial: {meshX: 64}
    constraints:
      spatial:
        factors: [R=1, S=1, P=1, Q=1, N=1, G=1]
        permutation: [M, C, P, Q, R, S, N]
        split: 0

  # ========================= Accumulator SRAM (per column) ==================
  # Hardware data path: output-side wider-bitwidth accumulation buffer.
  - !Component
    name: Accumulator
    class: smartbuffer_SRAM
    attributes:
      depth: 1024
      width: 32
      datawidth: 32
      n_banks: 2
      nports: 2
    constraints:
      dataspace: {keep: [Outputs], bypass: [Inputs, Weights]}

  # ========================= PE Rows (spatial dim 2) ========================
  - !Container
    name: PERows
    spatial: {meshY: 64}
    constraints:
      spatial:
        factors: [R=1, S=1, P=1, Q=1, N=1, G=1]
        permutation: [C, M, P, Q, R, S, N]
        split: 0

  # ========================= PE Registers ===================================
  # No temporal constraints — mapper freely chooses WS or OS
  - !Parallel
    nodes:
    - !Component
      name: WeightReg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 16
        datawidth: 16
      constraints:
        dataspace: {keep: [Weights]}

    - !Component
      name: InputReg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 16
        datawidth: 16
      constraints:
        dataspace: {keep: [Inputs]}

    - !Component
      name: OutputReg
      class: storage
      subclass: aladdin_register
      attributes:
        depth: 1
        width: 32
        datawidth: 32
      constraints:
        dataspace: {keep: [Outputs]}

  # ========================= MAC Unit =======================================
  - !Component
    name: mac
    class: intmac
    attributes:
      multiplier_width: 16
      adder_width: 32
