mapping:
  # Force full spatial utilization of all 64 MACs (8x8)
  # distributed_buffers: meshY=8, map M dimension spatially
  - target: distributed_buffers
    type: spatial
    factors: M=8
    permutation: [M, C, Q, R, S, P, N]
    split: 0  # Map to Y direction

  # reg_mac: meshY=8, map C (reduction) dimension spatially
  - target: reg_mac
    type: spatial
    factors: C=8
    permutation: [C, M, Q, R, S, P, N]
    split: 0  # Map to Y direction
