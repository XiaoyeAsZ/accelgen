mapping:
  - target: PPU_OutputReg
    type: datatype
    keep:
      - Outputs
    bypass:
      - Weights
      - Inputs
  - target: PPU_CoeffReg
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: PPU_InputReg
    type: datatype
    keep:
      - Inputs
    bypass:
      - Weights
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Inputs
      - Outputs
    bypass:
      - Weights
  - target: DRAM
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: PPU_OutputReg
    type: temporal
    factors: C1 M1 R1 S1 N2 P1 Q1 G1
    permutation: NCMRSPQG
  - target: PPU_CoeffReg
    type: temporal
    factors: C16 M1 R1 S1 N1 P1 Q1 G1
    permutation: CMRSNPQG
  - target: PPU_InputReg
    type: temporal
    factors: C1 M1 R1 S1 N2 P1 Q1 G1
    permutation: NCMRSPQG
  - target: GlobalBuffer
    type: temporal
    factors: C2 M1 R1 S1 N64 P2 Q1 G1
    permutation: PNCMRSQG
  - target: DRAM
    type: temporal
    factors: C32 M1 R1 S1 N32 P16 Q1 G1
    permutation: CPNMRSQG