# ===========================================================================
# LLaMA QK-Norm (K) — Step 1/7: Square  [MLIR: %28]  (GQA)
# ===========================================================================
# MLIR op: %28 = linalg.generic { math.fpowi %in, 2 } ins(%27)  [f32→f32]
# Position: RMSNorm applied to K heads after projection, before RoPE.
#
# Squares each element of the K tensor: x² = fpowi(x, 2)
# K uses GQA with only 8 KV heads instead of 32 Q heads.
#
# Full RMSNorm-K sequence in MLIR:
#   %27  extf bf16→f32           (type cast, no MAC)
#   %28  fpowi square            → this file
#   %31  addf sum reduction      → rmsnorm_k_sum_sq.yaml
#   %32  divf / head_dim         → rmsnorm_k_div_mean.yaml
#   %33  addf + epsilon          → rmsnorm_k_add_eps.yaml
#   %34  math.rsqrt              → rmsnorm_k_rsqrt.yaml
#   %35  mulf x × rsqrt          → rmsnorm_k_mul_norm.yaml
#   %37  truncf f32→bf16         (type cast, no MAC)
#   %38  mulf × weight (gamma)   → rmsnorm_k_mul_weight.yaml
#
# K tensor shape: [batch=8, seq=1024, heads_kv=8, head_dim=128]
# Total elements = 8 × 1024 × 8 × 128 = 8,388,608
# Total computes = 8192 × 1 × 8 × 128 = 8,388,608  (1 fpowi per element)
#
# Mapping to Conv2D problem shape:
#   N = 8192  (8 × 1024, batch × seq)
#   C = 1     (one fpowi/square per element)
#   M = 1     (one output per element)
#   P = 8     (KV attention heads, GQA)
#   Q = 128   (head dimension)
# ===========================================================================
problem:
  <<<: *problem_base
  instance:
    N: 8192       # batch × seq = 8 × 1024
    C: 1          # math.fpowi: 1 square per element
    M: 1          # one output per element
    R: 1
    S: 1
    P: 8          # KV attention heads (GQA: 8 heads)
    Q: 128        # head dimension
    G: 1
