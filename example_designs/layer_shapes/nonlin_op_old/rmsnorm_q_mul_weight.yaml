# ===========================================================================
# LLaMA QK-Norm (Q) — Step 7/7: Multiply by weight (gamma)  [MLIR: %18]
# ===========================================================================
# MLIR op: %18 = linalg.generic { arith.mulf %in, %in_29 }
#               ins(%arg8, %17 : tensor<128xbf16>, tensor<8x1024x32x128xbf16>)
#          indexing_maps = [#map4, #map2, #map2]
#          #map4: (d0,d1,d2,d3) -> (d3)  — weight broadcast over batch,seq,heads
# Position: RMSNorm step 7 — scale by learnable weight: y = γ × x̂
#
# Multiplies each normalized element by the per-head_dim weight vector γ[128],
# broadcast across batch, seq, and heads.
# One mulf per element.
#
# Input/output shape: [batch=8, seq=1024, heads=32, head_dim=128]
# Total elements = 8 × 1024 × 32 × 128 = 33,554,432
# Total computes = 8192 × 1 × 32 × 128 = 33,554,432  (1 mulf per element)
#
# Mapping to Conv2D problem shape:
#   N = 8192  (8 × 1024, batch × seq)
#   C = 1     (one mulf per element: γ × x̂)
#   M = 1     (one output per element)
#   P = 32    (Q attention heads)
#   Q = 128   (head dimension)
# ===========================================================================
problem:
  <<<: *problem_base
  instance:
    N: 8192       # batch × seq = 8 × 1024
    C: 1          # arith.mulf: γ × x̂ → 1 multiply per element
    M: 1          # one output per element
    R: 1
    S: 1
    P: 32         # Q attention heads
    Q: 128        # head dimension
    G: 1
