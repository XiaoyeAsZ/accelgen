# ===========================================================================
# LLaMA QK-Norm (Q) — Step 3/7: Divide by head_dim (mean)  [MLIR: %12]
# ===========================================================================
# MLIR op: %12 = linalg.generic { arith.divf %in, 128.0 } ins(%11)
# Position: RMSNorm step 3 — compute mean of squares: Σx² / d_k
#
# Divides the sum of squares by the head dimension (128.0) to get
# the mean of squares. One divf per head.
#
# Input/output shape: [batch=8, seq=1024, heads=32, 1]
# Total elements = 8 × 1024 × 32 × 1 = 262,144
# Total computes = 8192 × 1 × 32 × 1 = 262,144  (1 divf per element)
#
# Mapping to Conv2D problem shape:
#   N = 8192  (8 × 1024, batch × seq)
#   C = 1     (one divf per element)
#   M = 1     (one output per element)
#   P = 32    (Q attention heads)
#   Q = 1     (scalar per head)
# ===========================================================================
problem:
  <<<: *problem_base
  instance:
    N: 8192       # batch × seq = 8 × 1024
    C: 1          # arith.divf: divide by head_dim → 1 op per element
    M: 1          # one output per element
    R: 1
    S: 1
    P: 32         # Q attention heads
    Q: 1          # scalar per head
    G: 1
