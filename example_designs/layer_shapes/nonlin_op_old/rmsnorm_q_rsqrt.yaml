# ===========================================================================
# LLaMA QK-Norm (Q) — Step 5/7: Reciprocal Square Root  [MLIR: %14]
# ===========================================================================
# MLIR op: %14 = linalg.generic { math.rsqrt %in } ins(%13)
# Position: RMSNorm step 5 — compute 1/√(mean(x²) + ε)
#
# Computes the reciprocal square root of (mean_sq + epsilon).
# One rsqrt per head.
#
# Input/output shape: [batch=8, seq=1024, heads=32, 1]
# Total elements = 8 × 1024 × 32 × 1 = 262,144
# Total computes = 8192 × 1 × 32 × 1 = 262,144  (1 rsqrt per element)
#
# Mapping to Conv2D problem shape:
#   N = 8192  (8 × 1024, batch × seq)
#   C = 1     (one math.rsqrt per element)
#   M = 1     (one output per element)
#   P = 32    (Q attention heads)
#   Q = 1     (scalar per head)
# ===========================================================================
problem:
  <<<: *problem_base
  instance:
    N: 8192       # batch × seq = 8 × 1024
    C: 1          # math.rsqrt: 1 rsqrt per element
    M: 1          # one output per element
    R: 1
    S: 1
    P: 32         # Q attention heads
    Q: 1          # scalar per head
    G: 1
