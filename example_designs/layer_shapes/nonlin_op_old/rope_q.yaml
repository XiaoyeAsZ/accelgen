# ===========================================================================
# LLaMA RoPE Q — Step 1/4: Multiply Q by cos(θ)  [MLIR: %17]
# ===========================================================================
# MLIR op: %17 = linalg.generic { mulf } ins(transposed_3, expanded_cos)
# Position: RoPE step 1 for Q heads — elementwise Q × cos(θ).
# RoPE(x) = x * cos(θ) + rotate(x) * sin(θ)
#
# Full RoPE-Q is 4 separate operator calls in MLIR:
#   %17  Q * cos(θ)         → this file  (rope_q.yaml)
#   %19  negate Q[64:]      → rope_q_neg.yaml
#   %20  rotate(Q) * sin(θ) → rope_q_mul_sin.yaml
#   %21  %17 + %20          → rope_q_add.yaml
#
# Q tensor shape: [batch=8, heads=32, seq=1, head_dim=128]
# Total elements = 8 × 32 × 1 × 128 = 32,768
# Total computes = 8 × 1 × 32 × 128 = 32,768  (1 mulf per element)
#
# Mapping to Conv2D problem shape:
#   N = 8     (batch)
#   C = 1     (one mulf per element: Q × cos)
#   M = 1     (one output per element)
#   P = 32    (Q attention heads)
#   Q = 128   (head dimension)
# ===========================================================================
problem:
  <<<: *problem_base
  instance:
    N: 8          # batch size
    C: 1          # mulf: Q × cos(θ) → 1 multiply per element
    M: 1          # one output per element
    R: 1
    S: 1
    P: 32         # Q attention heads
    Q: 128        # head dimension
    G: 1
