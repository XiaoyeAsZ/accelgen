    split: 3
  - target: inter_PPU_spatial
    type: temporal
    factors: C1 M1 R1 S1 N1 P1 Q1 G1
    permutation: CMRSNPQG
  - target: GlobalBuffer
    type: temporal
    factors: C1 M1 R1 S1 N1 P1 Q8 G1
    permutation: QCMRSNPG
  - target: DRAM
    type: temporal
    factors: C1 M1 R1 S1 N128 P1 Q32 G1
